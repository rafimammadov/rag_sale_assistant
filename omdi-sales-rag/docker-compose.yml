services:
  app:
    build: .
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/app.db
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      qdrant:
        condition: service_started

  telegram:
    build: .
    command: ["python", "scripts/telegram_bot.py"]
    env_file:
      - .env
    environment:
      TELEGRAM_APP_BASE_URL: http://app:8000
      TELEGRAM_STATE_PATH: /app/data/telegram-state.json
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      app:
        condition: service_started
    profiles:
      - telegram
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  app_data:
  qdrant_data:
